{% extends 'base.html' %}{% block content %}<div class="auth-card card p-4 mx-auto"><h3>Đăng nhập</h3><p>Dành cho giảng viên và quản trị viên.</p><form method="post"><label>Tài khoản</label><input class="form-control mb-3" name="username" required autocomplete="username"><label>Mật khẩu</label><input class="form-control mb-3" name="password" type="password" required autocomplete="current-password"><button class="btn btn-primary">Đăng nhập</button></form><hr><p class="mb-0">Giảng viên chưa có tài khoản? <a class="btn btn-outline-primary btn-sm ms-1" href="{{ url_for('register') }}">Đăng ký bằng key</a></p></div>{% endblock %}
