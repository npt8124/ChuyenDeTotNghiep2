{% extends 'base.html' %}{% block content %}<div class="auth-card card p-4 mx-auto"><h3>Đăng ký giảng viên</h3><p>Chỉ tài khoản có key đăng ký hợp lệ mới được tạo.</p><form method="post"><label>Tên đăng nhập</label><input class="form-control mb-3" name="username" required minlength="3" maxlength="80" autocomplete="username"><label>Mật khẩu (tối thiểu 10 ký tự)</label><input class="form-control mb-3" name="password" type="password" required minlength="10" autocomplete="new-password"><label>Nhập lại mật khẩu</label><input class="form-control mb-3" name="confirm_password" type="password" required minlength="10" autocomplete="new-password"><label>Key đăng ký</label><input class="form-control mb-3" name="registration_key" type="password" required autocomplete="off"><button class="btn btn-primary">Tạo tài khoản</button></form><p class="mt-3 mb-0"><a href="{{ url_for('login') }}">Quay lại đăng nhập</a></p></div>{% endblock %}
