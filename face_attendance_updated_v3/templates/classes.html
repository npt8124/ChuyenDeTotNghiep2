{% extends 'base.html' %}{% block content %}<h2>Quản lý lớp học</h2><form method="post" class="card p-3 mb-4"><div class="row g-2"><div class="col-md-3"><input name="code" class="form-control" placeholder="Mã lớp" required></div><div class="col-md-6"><input name="name" class="form-control" placeholder="Tên lớp" required></div><div class="col-md-3"><button class="btn btn-primary w-100">Thêm lớp</button></div></div></form><table class="table table-striped"><thead><tr><th>Mã lớp</th><th>Tên lớp</th><th>Số sinh viên</th></tr></thead><tbody>{% for c in classes %}<tr><td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ c.students|length }}</td></tr>{% endfor %}</tbody></table>{% endblock %}
