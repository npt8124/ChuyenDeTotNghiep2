{% extends 'base.html' %}{% block content %}<h2>Buổi điểm danh</h2><form method="post" class="card p-3 mb-4"><div class="row g-2"><div class="col-md-6"><input name="title" class="form-control" placeholder="Ví dụ: Buổi 1 - Nhập môn AI" required></div><div class="col-md-4"><select name="class_id" class="form-select">{% for c in classes %}<option value="{{ c.id }}">{{ c.code }} — {{ c.name }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">Tạo buổi</button></div></div></form><table class="table table-striped"><thead><tr><th>Buổi</th><th>Lớp</th><th>Ngày tạo</th><th>Trạng thái</th></tr></thead><tbody>{% for s in sessions %}<tr><td><a href="{{ url_for('session_detail',session_id=s.id) }}">{{ s.title }}</a></td><td>{{ s.school_class.code }}</td><td>{{ s.started_at.strftime('%d/%m/%Y %H:%M') }}</td><td>{{ 'Đã kết thúc' if s.ended_at else 'Đang mở' }}</td></tr>{% endfor %}</tbody></table>{% endblock %}
