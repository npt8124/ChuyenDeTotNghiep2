{% extends 'base.html' %}{% block content %}<h2>Quản lý sinh viên</h2><form method="post" class="card p-3 mb-4"><div class="row g-2"><div class="col-md-3"><input name="code" class="form-control" placeholder="Mã sinh viên" required></div><div class="col-md-4"><input name="name" class="form-control" placeholder="Họ và tên" required></div><div class="col-md-3"><select name="class_id" class="form-select" required>{% for c in classes %}<option value="{{ c.id }}">{{ c.code }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">Thêm</button></div></div></form><table class="table table-striped"><thead><tr><th>MSSV</th><th>Họ tên</th><th>Lớp</th><th>Ảnh đăng ký</th><th></th></tr></thead><tbody>{% for s in students %}<tr><td>{{ s.code }}</td><td>{{ s.full_name }}</td><td>{{ s.school_class.code }}</td><td>{{ s.faces|length }}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('enroll',student_id=s.id) }}">Đăng ký khuôn mặt</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
