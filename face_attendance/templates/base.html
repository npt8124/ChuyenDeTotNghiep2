<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Face Attendance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">Face Attendance</a>{% if current_user.is_authenticated %}<div class="d-flex gap-3 align-items-center flex-wrap"><a href="{{ url_for('dashboard') }}">Tổng quan</a><a href="{{ url_for('classes') }}">Lớp học</a><a href="{{ url_for('students') }}">Sinh viên</a><a href="{{ url_for('sessions') }}">Buổi điểm danh</a><form method="post" action="{{ url_for('logout') }}"><button class="btn btn-sm btn-outline-light">Đăng xuất</button></form></div>{% endif %}</div></nav><main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
